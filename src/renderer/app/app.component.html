@if (showLoading()) {
  <div class="unity-overlay loading">
    <div class="spinner"></div>
    <p>Loading Unity scene...</p>
    <p class="hint">First launch may take up to 30s while HDRP compiles shaders.</p>
  </div>
}

@if (showError()) {
  <div class="unity-overlay error">
    <h2>Unity could not start</h2>
    <p class="msg">{{ unity.status().error }}</p>
    @if (unity.status().logPath) {
      <p class="log-path"><strong>Log:</strong> {{ unity.status().logPath }}</p>
    }
    <button type="button" (click)="restartUnity()">Restart Unity</button>
  </div>
}

@if (unity.ready()) {
  <app-side-panel side="left" mode="overlay" heading="Scene control">
    <app-scene-controls></app-scene-controls>
    <mat-divider></mat-divider>
    <app-ws-inspector class="side-panel__inspector"></app-ws-inspector>
  </app-side-panel>

  <app-side-panel side="right" mode="overlay" heading="Right panel">
    <p class="placeholder">Nothing here yet.</p>
  </app-side-panel>
}
