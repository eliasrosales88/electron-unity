<!-- Position and size are inline bindings on purpose: :host selectors do not
     take effect in this build setup, so relying on the stylesheet to anchor the
     panel to its edge silently left both panels stacked at x=0. -->
<aside
  class="side-panel"
  [class.side-panel--collapsed]="collapsed()"
  [class.side-panel--right]="side() === 'right'"
  [style.position]="'fixed'"
  [style.top.px]="0"
  [style.bottom.px]="0"
  [style.left]="side() === 'left' ? '0px' : 'auto'"
  [style.right]="side() === 'right' ? '0px' : 'auto'"
  [style.width.px]="width()"
>
  @if (!collapsed()) {
    <header class="side-panel__header">
      <div class="side-panel__brand">
        <span class="dot" [ngClass]="'state-' + wsState()"></span>
        <h1>{{ heading() }}</h1>
      </div>
      <button
        mat-icon-button
        type="button"
        class="side-panel__toggle"
        (click)="toggle()"
        title="Collapse panel"
        aria-label="Collapse panel"
      >
        <mat-icon>{{ toggleIcon() }}</mat-icon>
      </button>
    </header>

    <mat-divider></mat-divider>

    <div class="side-panel__content">
      <ng-content></ng-content>
    </div>
  } @else {
    <button
      mat-icon-button
      type="button"
      class="side-panel__toggle side-panel__toggle--expand"
      (click)="toggle()"
      title="Expand panel"
      aria-label="Expand panel"
    >
      <mat-icon>{{ toggleIcon() }}</mat-icon>
    </button>
  }
</aside>
