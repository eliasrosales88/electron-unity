<section class="scene-controls">
  <h2 class="scene-controls__title">Scene</h2>
  <p class="scene-controls__subtitle">Panel rotation</p>

  <div class="axis">
    <div class="axis__label">
      <span>Yaw <small>(Y axis)</small></span>
      <span class="axis__value">{{ yaw() | number: '1.0-0' }}°</span>
    </div>
    <mat-slider class="axis__slider" [min]="-180" [max]="180" [step]="1" [displayWith]="formatLabel" [disabled]="disabled()" discrete>
      <input
        matSliderThumb
        #yawThumb="matSliderThumb"
        [value]="yaw()"
        (input)="onValueChange('yaw', yawThumb.value)"
        (dragStart)="onDragStart()"
        (dragEnd)="onDragEnd()"
      />
    </mat-slider>
  </div>

  <div class="axis">
    <div class="axis__label">
      <span>Pitch <small>(X axis)</small></span>
      <span class="axis__value">{{ pitch() | number: '1.0-0' }}°</span>
    </div>
    <mat-slider class="axis__slider" [min]="-85" [max]="85" [step]="1" [displayWith]="formatLabel" [disabled]="disabled()" discrete>
      <input
        matSliderThumb
        #pitchThumb="matSliderThumb"
        [value]="pitch()"
        (input)="onValueChange('pitch', pitchThumb.value)"
        (dragStart)="onDragStart()"
        (dragEnd)="onDragEnd()"
      />
    </mat-slider>
  </div>

  <div class="axis">
    <div class="axis__label">
      <span>Roll <small>(Z axis)</small></span>
      <span class="axis__value">{{ roll() | number: '1.0-0' }}°</span>
    </div>
    <mat-slider class="axis__slider" [min]="-180" [max]="180" [step]="1" [displayWith]="formatLabel" [disabled]="disabled()" discrete>
      <input
        matSliderThumb
        #rollThumb="matSliderThumb"
        [value]="roll()"
        (input)="onValueChange('roll', rollThumb.value)"
        (dragStart)="onDragStart()"
        (dragEnd)="onDragEnd()"
      />
    </mat-slider>
  </div>

  <div class="scene-controls__actions">
    <button mat-stroked-button type="button" (click)="reset()" [disabled]="disabled()">
      Reset pose
    </button>
  </div>

  @if (readOnly()) {
    <p class="scene-controls__hint">The presenter is driving this scene.</p>
  } @else if (disabled()) {
    <p class="scene-controls__hint">Waiting for the WebSocket connection to Unity…</p>
  }
</section>
