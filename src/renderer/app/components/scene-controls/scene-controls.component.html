<section class="scene-controls">
  <h2 class="scene-controls__title">Escena</h2>
  <p class="scene-controls__subtitle">Rotación del panel</p>

  <div class="axis">
    <div class="axis__label">
      <span>Yaw <small>(eje Y)</small></span>
      <span class="axis__value">{{ yaw() | number: '1.0-0' }}°</span>
    </div>
    <mat-slider class="axis__slider" [min]="-180" [max]="180" [step]="1" [displayWith]="formatLabel" [disabled]="disabled()" discrete>
      <input
        matSliderThumb
        [value]="yaw()"
        (valueChange)="onValueChange('yaw', $event)"
        (dragStart)="onDragStart()"
        (dragEnd)="onDragEnd()"
      />
    </mat-slider>
  </div>

  <div class="axis">
    <div class="axis__label">
      <span>Pitch <small>(eje X)</small></span>
      <span class="axis__value">{{ pitch() | number: '1.0-0' }}°</span>
    </div>
    <mat-slider class="axis__slider" [min]="-85" [max]="85" [step]="1" [displayWith]="formatLabel" [disabled]="disabled()" discrete>
      <input
        matSliderThumb
        [value]="pitch()"
        (valueChange)="onValueChange('pitch', $event)"
        (dragStart)="onDragStart()"
        (dragEnd)="onDragEnd()"
      />
    </mat-slider>
  </div>

  <div class="axis">
    <div class="axis__label">
      <span>Roll <small>(eje Z)</small></span>
      <span class="axis__value">{{ roll() | number: '1.0-0' }}°</span>
    </div>
    <mat-slider class="axis__slider" [min]="-180" [max]="180" [step]="1" [displayWith]="formatLabel" [disabled]="disabled()" discrete>
      <input
        matSliderThumb
        [value]="roll()"
        (valueChange)="onValueChange('roll', $event)"
        (dragStart)="onDragStart()"
        (dragEnd)="onDragEnd()"
      />
    </mat-slider>
  </div>

  <div class="scene-controls__actions">
    <button mat-stroked-button type="button" (click)="reset()" [disabled]="disabled()">
      Reiniciar pose
    </button>
  </div>

  @if (disabled()) {
    <p class="scene-controls__hint">Esperando conexión WebSocket con Unity…</p>
  }
</section>
